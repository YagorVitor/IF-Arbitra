name: Backend verification

on:
  push:
    paths:
      - "backend/**"
      - "compose.backend.yaml"
      - ".github/workflows/backend-ci.yml"
      - "docs/openapi.json"
  pull_request:
    paths:
      - "backend/**"
      - "compose.backend.yaml"
      - ".github/workflows/backend-ci.yml"
      - "docs/openapi.json"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: arbitra
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: arbitra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U arbitra -d arbitra_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://arbitra:ci-only@127.0.0.1:5432/arbitra_test
      DATABASE_URL: postgresql+psycopg://arbitra:ci-only@127.0.0.1:5432/arbitra_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/constraints.txt
      - name: Install backend
        run: python -m pip install -c backend/requirements/constraints.txt -e "./backend[dev]"
      - name: Check formatting and lint
        run: |
          python -m ruff check backend
          python -m ruff format --check backend
      - name: Run PostgreSQL test suite
        run: python -m pytest backend/tests -q -s
      - name: Check frontend contract
        run: python -m app.commands.export_openapi --check
