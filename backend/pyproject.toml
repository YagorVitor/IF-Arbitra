[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "if-arbitra"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.38,<2.1", "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2", "pydantic-settings>=2.7,<3", "argon2-cffi>=23.1,<26"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"] # FastAPI evaluates dependency/parameter declarations at import time by design.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a dedicated PostgreSQL test database"]
